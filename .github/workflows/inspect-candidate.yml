name: Inspect synthetic candidate

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Candidate image digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Inspect candidate attestations
        env:
          DIGEST: ${{ inputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          ref="ghcr.io/${GITHUB_REPOSITORY,,}@$DIGEST"
          docker buildx imagetools inspect "$ref"
          for field in SBOM.SPDX Provenance.SLSA; do
            printf '\n--- %s ---\n' "$field"
            docker buildx imagetools inspect "$ref" --format "{{json .$field}}"
          done
